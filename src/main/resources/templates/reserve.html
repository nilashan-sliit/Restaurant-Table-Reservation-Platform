<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reserve a Table – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }
        .bg-texture {
          background-color: #faf8f5;
          background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen p-6">

<!-- Nav -->
<nav class="max-w-3xl mx-auto flex items-center justify-between mb-10">
    <h1 class="serif text-3xl font-semibold text-stone-800">TableGlo</h1>
    <div class="flex items-center gap-4">
        <a th:href="@{/reservations/my}" class="text-sm text-stone-500 hover:text-stone-800 transition-colors">My Reservations</a>
        <span class="text-stone-300">|</span>
        <span class="text-sm text-stone-500">
            Hello, <span class="font-medium text-stone-800" th:text="${user.username}">User</span>
            <span th:if="${user.membershipType == 'VIP'}" class="ml-1 text-xs text-amber-600 font-medium">★ VIP</span>
        </span>
        <a th:href="@{/users/logout}" class="text-xs tracking-widest uppercase text-amber-700 hover:text-amber-900 border border-amber-300 px-3 py-1.5 rounded-lg transition-colors">Logout</a>
    </div>
</nav>

<div class="max-w-3xl mx-auto">

    <!-- Header -->
    <div class="mb-8">
        <p class="text-xs tracking-widest text-amber-700 uppercase mb-1">Dining Experience</p>
        <h2 class="serif text-5xl font-semibold text-stone-800">Reserve a Table</h2>
        <p class="text-stone-500 mt-2 text-sm">Choose your table, date, and time. We'll hold it for you.</p>
    </div>

    <!-- VIP notice -->
    <div th:if="${user.membershipType == 'VIP'}"
         class="mb-6 bg-amber-50 border border-amber-200 rounded-xl px-5 py-4 flex items-center gap-3">
        <span class="text-amber-600 text-xl">★</span>
        <p class="text-sm text-amber-800">As a <strong>VIP member</strong>, you enjoy free cancellation on all reservations.</p>
    </div>

    <!-- Error -->
    <div th:if="${error}" class="mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-5 py-4 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span th:text="${error}">Error message</span>
    </div>

    <!-- Form Card -->
    <div class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-8">

        <form th:action="@{/reservations/reserve}" method="post" class="space-y-7">

            <!-- Table Selection -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-3">Select Table</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label th:each="table : ${tables}"
                           class="flex items-center gap-3 border border-stone-200 rounded-xl p-4 cursor-pointer hover:border-amber-500 transition-colors has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50">
                        <input type="radio" name="tableId" th:value="${table}" required class="accent-amber-700"/>
                        <div>
                            <p class="text-sm font-medium text-stone-800" th:text="${#strings.substringBefore(table, ' (')}">Table</p>
                            <p class="text-xs text-stone-400 mt-0.5" th:text="${#strings.substringAfter(table, '- ')}">Details</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Date -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Reservation Date</label>
                <input type="date" name="date" required
                       th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                       class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
            </div>

            <!-- Time Slot -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-3">Select Time Slot</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <label th:each="slot : ${timeSlots}"
                           class="flex items-center gap-2 border border-stone-200 rounded-xl p-3 cursor-pointer hover:border-amber-500 transition-colors has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50">
                        <input type="radio" name="timeSlot" th:value="${slot}" required class="accent-amber-700"/>
                        <span class="text-xs font-medium text-stone-700" th:text="${slot}">Slot</span>
                    </label>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-2">
                <button type="submit"
                        class="w-full bg-stone-800 hover:bg-amber-800 text-white text-sm tracking-widest uppercase py-3.5 rounded-xl transition-colors duration-200">
                    Confirm Reservation
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
