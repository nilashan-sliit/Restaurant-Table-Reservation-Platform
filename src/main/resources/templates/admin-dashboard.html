<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Cormorant Garamond', serif; }
        .bg-texture {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen p-6">

<!-- NAV -->
<nav class="max-w-6xl mx-auto flex justify-between items-center mb-8">
    <div>
        <h1 class="serif text-3xl text-stone-800">TableGlo</h1>
        <p class="text-xs text-amber-700 uppercase tracking-widest">Admin Dashboard</p>
    </div>
    <a th:href="@{/admin/logout}"
       class="text-xs uppercase tracking-widest border px-4 py-2 rounded-lg text-amber-700 border-amber-300 hover:bg-amber-100">
        Logout
    </a>
</nav>

<div class="max-w-6xl mx-auto">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="serif text-4xl text-stone-800">Welcome, <span th:text="${admin.name}">Admin</span></h2>
            <p class="text-stone-500 text-sm">Manage system admins</p>
        </div>
        <button onclick="openAddModal()"
                class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2 rounded-xl text-sm">
            + Add Admin
        </button>
    </div>

    <!-- ERROR -->
    <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3" th:text="${error}"></div>

    <!-- TABLE -->
    <div class="bg-white/80 border border-stone-200 rounded-2xl overflow-hidden">

        <div th:if="${admins.isEmpty()}" class="text-center py-16">
            <p class="serif text-2xl text-stone-400">No admins yet</p>
            <p class="text-sm text-stone-400 mt-1">Click "+ Add Admin" to create one.</p>
        </div>

        <table th:if="${!admins.isEmpty()}" class="w-full text-sm">
            <thead class="bg-stone-100 text-stone-500 uppercase text-xs">
            <tr>
                <th class="p-4 text-left">ID</th>
                <th class="p-4 text-left">Name</th>
                <th class="p-4 text-left">Email</th>
                <th class="p-4 text-left">Phone</th>
                <th class="p-4 text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${admins}" class="border-t hover:bg-stone-50">
                <td class="p-4 font-mono text-xs text-stone-400" th:text="${a.id}"></td>
                <td class="p-4 font-medium text-stone-800" th:text="${a.name}"></td>
                <td class="p-4 text-stone-600" th:text="${a.email}"></td>
                <td class="p-4 text-stone-600" th:text="${a.phone}"></td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-2">

                        <!-- EDIT -->
                        <button type="button"
                                th:data-id="${a.id}"
                                th:data-name="${a.name}"
                                th:data-email="${a.email}"
                                th:data-phone="${a.phone}"
                                onclick="openEditModal(this)"
                                class="text-xs text-blue-600 border border-blue-200 hover:bg-blue-50 px-3 py-1.5 rounded-lg">
                            Edit
                        </button>

                        <!-- DELETE -->
                        <form th:action="@{/admin/delete/{id}(id=${a.id})}" method="post"
                              onsubmit="return confirm('Delete this admin?')">
                            <button type="submit"
                                    class="text-xs text-red-500 border border-red-200 hover:bg-red-50 px-3 py-1.5 rounded-lg">
                                Delete
                            </button>
                        </form>

                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-2xl w-full max-w-md shadow-xl">
        <h3 class="serif text-2xl mb-6 text-stone-800">Add Admin</h3>
        <form action="/admin/add" method="post" class="space-y-4">
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Name</label>
                <input type="text" name="name" required placeholder="e.g. john"
                       class="w-full border-b border-stone-300 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Email</label>
                <input type="email" name="email" required placeholder="admin@example.com"
                       class="w-full border-b border-stone-300 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Phone</label>
                <input type="text" name="phone" required placeholder="0770000000"
                       class="w-full border-b border-stone-300 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full border-b border-stone-300 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <button type="button" onclick="closeAddModal()"
                        class="px-4 py-2 text-sm border border-stone-300 rounded-lg text-stone-600 hover:bg-stone-50">
                    Cancel
                </button>
                <button type="submit"
                        class="px-5 py-2 text-sm bg-amber-700 hover:bg-amber-800 text-white rounded-lg">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div id="editModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-2xl w-full max-w-md shadow-xl">
        <h3 class="serif text-2xl mb-6 text-stone-800">Edit Admin</h3>
        <form action="/admin/update" method="post" class="space-y-4">
            <input type="hidden" name="id" id="editId"/>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Name</label>
                <input type="text" id="editName" disabled
                       class="w-full border-b border-stone-200 py-2 text-stone-400 bg-transparent cursor-not-allowed"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Email</label>
                <input type="email" name="email" id="editEmail" required
                       class="w-full border-b border-stone-300 py-2 text-stone-800 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">Phone</label>
                <input type="text" name="phone" id="editPhone" required
                       class="w-full border-b border-stone-300 py-2 text-stone-800 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-1">New Password</label>
                <input type="password" name="password" placeholder="Leave blank to keep current"
                       class="w-full border-b border-stone-300 py-2 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 bg-transparent"/>
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <button type="button" onclick="closeEditModal()"
                        class="px-4 py-2 text-sm border border-stone-300 rounded-lg text-stone-600 hover:bg-stone-50">
                    Cancel
                </button>
                <button type="submit"
                        class="px-5 py-2 text-sm bg-stone-800 hover:bg-amber-800 text-white rounded-lg">
                    Update
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function openAddModal()  { document.getElementById("addModal").classList.remove("hidden"); }
    function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }

    function openEditModal(btn) {
        document.getElementById("editId").value    = btn.dataset.id;
        document.getElementById("editName").value  = btn.dataset.name;
        document.getElementById("editEmail").value = btn.dataset.email;
        document.getElementById("editPhone").value = btn.dataset.phone;
        document.getElementById("editModal").classList.remove("hidden");
    }
    function closeEditModal() { document.getElementById("editModal").classList.add("hidden"); }
</script>

</body>
</html>
