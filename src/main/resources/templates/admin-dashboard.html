<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard – TableGlo</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet"/>

    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }

        .bg-texture {
            background-color: #faf8f5;
            background-image:
                    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>

<body class="bg-texture min-h-screen p-6">

<!-- NAV -->
<nav class="max-w-6xl mx-auto flex justify-between items-center mb-8">

    <div>
        <h1 class="serif text-3xl text-stone-800">TableGlo</h1>
        <p class="text-xs text-amber-700 uppercase tracking-widest">Admin Dashboard</p>
    </div>

    <a th:href="@{/admin/logout}"
       class="text-xs uppercase tracking-widest border px-4 py-2 rounded-lg text-amber-700 border-amber-300 hover:bg-amber-100">
        Logout
    </a>

</nav>

<div class="max-w-6xl mx-auto">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">

        <div>
            <h2 class="serif text-4xl text-stone-800" th:text="${admin.name}">Admin</h2>
            <p class="text-stone-500">Manage system admins</p>
        </div>

        <!-- ADD BUTTON -->
        <button onclick="openModal()"
                class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2 rounded-xl text-sm">
            + Add Admin
        </button>

    </div>

    <!-- TABLE -->
    <div class="bg-white/80 border border-stone-200 rounded-2xl overflow-hidden">

        <table class="w-full text-sm">

            <thead class="bg-stone-100 text-stone-600 uppercase text-xs">
            <tr>
                <th class="p-4 text-left">ID</th>
                <th class="p-4 text-left">Name</th>
                <th class="p-4 text-left">Email</th>
                <th class="p-4 text-left">Phone</th>
                <th class="p-4 text-center">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="a : ${admins}" class="border-t hover:bg-stone-50">

                <td class="p-4" th:text="${a.id}">A01</td>
                <td class="p-4" th:text="${a.name}">John</td>
                <td class="p-4" th:text="${a.email}">john@email.com</td>
                <td class="p-4" th:text="${a.phone}">0770000000</td>

                <td class="p-4 text-center flex justify-center gap-3">

                    <!-- EDIT ICON -->
                    <button class="text-blue-600 hover:text-blue-800">
                        ✏️
                    </button>

                    <!-- DELETE ICON -->
                    <button class="text-red-600 hover:text-red-800">
                        🗑️
                    </button>

                </td>

            </tr>

            </tbody>

        </table>
    </div>

</div>

<!-- ================= MODAL ================= -->
<div id="modal"
     class="hidden fixed inset-0 bg-black/40 flex items-center justify-center">

    <div class="bg-white p-6 rounded-2xl w-full max-w-md">

        <h3 class="serif text-2xl mb-4">Add Admin</h3>

        <form>

            <input type="text" placeholder="Name"
                   class="w-full border p-2 mb-3 rounded"/>

            <input type="email" placeholder="Email"
                   class="w-full border p-2 mb-3 rounded"/>

            <input type="text" placeholder="Phone"
                   class="w-full border p-2 mb-3 rounded"/>

            <input type="password" placeholder="Password"
                   class="w-full border p-2 mb-4 rounded"/>

            <div class="flex justify-end gap-2">

                <button type="button"
                        onclick="closeModal()"
                        class="px-4 py-2 text-sm border rounded">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 text-sm bg-amber-700 text-white rounded">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>

<!-- ================= JS ================= -->
<script>
    function openModal() {
        document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("modal").classList.add("hidden");
    }
</script>

</body>
</html>
