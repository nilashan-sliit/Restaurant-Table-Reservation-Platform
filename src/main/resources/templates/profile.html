<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }
        .bg-texture {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen p-6">

<!-- Nav -->
<nav class="max-w-4xl mx-auto flex items-center justify-between mb-10">
    <h1 class="serif text-3xl font-semibold text-stone-800">TableGlo</h1>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500">
        Hello, <span class="text-stone-800 font-medium" th:text="${user.username}">User</span>
      </span>
        <a th:href="@{/users/logout}"
           class="text-xs tracking-widest uppercase text-amber-700 hover:text-amber-900 border border-amber-300 hover:border-amber-600 px-4 py-2 rounded-lg transition-colors">
            Logout
        </a>
    </div>
</nav>

<div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Left — User Card -->
    <div class="md:col-span-1">
        <div class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-6 text-center">

            <!-- Avatar initials -->
            <div class="w-20 h-20 rounded-full bg-stone-800 flex items-center justify-center mx-auto mb-4">
          <span class="serif text-3xl text-white font-semibold"
                th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">N</span>
            </div>

            <h2 class="serif text-2xl font-semibold text-stone-800" th:text="${user.username}">Username</h2>
            <p class="text-stone-500 text-sm mt-1" th:text="${user.email}">email@example.com</p>

            <!-- Badge -->
            <div class="mt-4">
          <span th:if="${user.membershipType == 'VIP'}"
                class="inline-block bg-amber-100 text-amber-800 text-xs tracking-widest uppercase px-3 py-1 rounded-full font-medium">
            ★ VIP Member
          </span>
                <span th:if="${user.membershipType != 'VIP'}"
                      class="inline-block bg-stone-100 text-stone-600 text-xs tracking-widest uppercase px-3 py-1 rounded-full font-medium">
            Regular Member
          </span>
            </div>

            <!-- Info rows -->
            <div class="mt-6 text-left space-y-3">
                <div class="flex justify-between text-sm border-b border-stone-100 pb-2">
                    <span class="text-stone-400 uppercase tracking-wider text-xs">User ID</span>
                    <span class="text-stone-700 font-mono text-xs" th:text="${user.userId}">U001</span>
                </div>
                <div class="flex justify-between text-sm border-b border-stone-100 pb-2">
                    <span class="text-stone-400 uppercase tracking-wider text-xs">Phone</span>
                    <span class="text-stone-700 text-xs" th:text="${user.phone}">+94 77 000 0000</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-stone-400 uppercase tracking-wider text-xs">Joined</span>
                    <span class="text-stone-700 text-xs" th:text="${user.registrationDate}">2024-01-01</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Right — Update Form -->
    <div class="md:col-span-2">
        <div class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-8">

            <div class="mb-6">
                <p class="text-xs tracking-widest text-amber-700 uppercase mb-1">Account Settings</p>
                <h2 class="serif text-3xl font-semibold text-stone-800">Update Profile</h2>
            </div>

            <!-- Success / Error messages -->
            <div th:if="${updateSuccess}" class="mb-6 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3">
                Profile updated successfully.
            </div>
            <div th:if="${updateError}" class="mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3"
                 th:text="${updateError}">Error</div>

            <form th:action="@{/users/update}" method="post" class="space-y-5">

                <!-- Hidden userId -->
                <input type="hidden" name="userId" th:value="${user.userId}"/>

                <!-- Email -->
                <div>
                    <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Email</label>
                    <input type="email" name="email" th:value="${user.email}" required
                           class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Phone</label>
                    <input type="tel" name="phone" th:value="${user.phone}" required
                           class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">New Password</label>
                    <input type="password" name="password" placeholder="Leave blank to keep current"
                           class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-stone-800 hover:bg-amber-800 text-white text-sm tracking-widest uppercase py-3.5 rounded-xl transition-colors duration-200">
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
