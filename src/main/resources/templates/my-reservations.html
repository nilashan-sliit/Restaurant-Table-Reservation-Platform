<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Reservations – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }
        .bg-texture {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen p-6">

<!-- Nav -->
<nav class="max-w-5xl mx-auto flex items-center justify-between mb-10">
    <h1 class="serif text-3xl font-semibold text-stone-800">TableGlo</h1>
    <div class="flex items-center gap-4">
        <a th:href="@{/reservations/reserve}"
           class="bg-stone-800 hover:bg-amber-800 text-white text-xs tracking-widest uppercase px-4 py-2 rounded-lg transition-colors">
            + New Reservation
        </a>
        <a th:href="@{/users/profile}" class="text-sm text-stone-500 hover:text-stone-800">Profile</a>
        <a th:href="@{/users/logout}" class="text-xs tracking-widest uppercase text-amber-700 border border-amber-300 px-3 py-1.5 rounded-lg transition-colors">Logout</a>
    </div>
</nav>

<div class="max-w-5xl mx-auto">

    <!-- Header -->
    <div class="mb-8">
        <p class="text-xs tracking-widest text-amber-700 uppercase mb-1">Your Bookings</p>
        <h2 class="serif text-5xl font-semibold text-stone-800">My Reservations</h2>
        <p class="text-stone-500 mt-1 text-sm">
            Logged in as <span class="font-medium text-stone-700" th:text="${user.username}">User</span>
            <span th:if="${user.membershipType == 'VIP'}" class="ml-1 text-amber-600 font-medium text-xs">★ VIP</span>
        </p>
    </div>

    <!-- Empty state -->
    <div th:if="${reservations.isEmpty()}"
         class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-16 text-center">
        <p class="serif text-3xl text-stone-400 mb-2">No reservations yet</p>
        <p class="text-stone-400 text-sm mb-6">You haven't made any bookings. Reserve your first table now.</p>
        <a th:href="@{/reservations/reserve}"
           class="inline-block bg-stone-800 hover:bg-amber-800 text-white text-xs tracking-widest uppercase px-6 py-3 rounded-xl transition-colors">
            Reserve a Table
        </a>
    </div>

    <!-- Reservations grid -->
    <div th:if="${!reservations.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div th:each="r : ${reservations}"
             class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-6 flex flex-col gap-4">

            <!-- Card header -->
            <div class="flex items-start justify-between">
                <div>
                    <p class="font-mono text-xs text-stone-400" th:text="${r.reservationId}">R001</p>
                    <p class="font-semibold text-stone-800 mt-1" th:text="${r.tableId}">Table</p>
                </div>
                <!-- Status badge -->
                <span th:if="${r.status == 'Active'}"
                      class="inline-block bg-green-100 text-green-700 text-xs tracking-widest uppercase px-3 py-1 rounded-full font-medium">
                    Active
                </span>
                <span th:if="${r.status == 'Cancelled'}"
                      class="inline-block bg-red-100 text-red-600 text-xs tracking-widest uppercase px-3 py-1 rounded-full font-medium">
                    Cancelled
                </span>
            </div>

            <!-- Details -->
            <div class="space-y-2 text-sm">
                <div class="flex justify-between border-b border-stone-100 pb-2">
                    <span class="text-stone-400 text-xs uppercase tracking-wider">Date</span>
                    <span class="text-stone-700" th:text="${r.reservationDate}">2024-01-01</span>
                </div>
                <div class="flex justify-between border-b border-stone-100 pb-2">
                    <span class="text-stone-400 text-xs uppercase tracking-wider">Time</span>
                    <span class="text-stone-700" th:text="${r.timeSlot}">07:30 PM</span>
                </div>
                <div th:if="${r.status == 'Cancelled'}" class="flex justify-between">
                    <span class="text-stone-400 text-xs uppercase tracking-wider">Cancellation Fee</span>
                    <span class="text-red-600 font-medium"
                          th:text="${r.cancellationFee == 0 ? 'Free (VIP)' : 'LKR ' + r.cancellationFee}">
                        LKR 500
                    </span>
                </div>
            </div>

            <!-- Cancel button (only for active reservations) -->
            <div th:if="${r.status == 'Active'}" class="mt-auto pt-2">
                <form th:action="@{/reservations/cancel/{id}(id=${r.reservationId})}" method="get">
                    <button type="submit"
                            class="w-full text-sm text-red-500 hover:text-red-700 border border-red-200 hover:border-red-400 py-2 rounded-xl transition-colors">
                        Cancel Reservation
                    </button>
                </form>
            </div>

        </div>
    </div>

</div>

</body>
</html>
