<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }
        .input-field {
            @apply w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200;
        }
        .bg-texture {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-10">
        <p class="text-xs tracking-[0.3em] text-amber-700 uppercase mb-2">Restaurant Reservation</p>
        <h1 class="serif text-5xl font-semibold text-stone-800">TableGlo</h1>
        <div class="mt-3 flex items-center justify-center gap-3">
            <div class="h-px w-12 bg-stone-300"></div>
            <span class="text-stone-400 text-xs tracking-widest uppercase">Create Account</span>
            <div class="h-px w-12 bg-stone-300"></div>
        </div>
    </div>

    <!-- Card -->
    <div class="bg-white/80 backdrop-blur-sm border border-stone-200 rounded-2xl shadow-sm p-8">

        <!-- Error message -->
        <div th:if="${error}" class="mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 flex items-center gap-2">
            <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/users/register}" method="post" class="space-y-6">

            <!-- Username -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Username</label>
                <input type="text" name="username" required placeholder="e.g. nilashan"
                       class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Email</label>
                <input type="email" name="email" required placeholder="you@example.com"
                       class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Phone</label>
                <input type="tel" name="phone" required placeholder="+94 77 000 0000"
                       class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-2">Password</label>
                <input type="password" name="password" required placeholder="Min. 8 characters"
                       class="w-full bg-transparent border-b border-stone-300 py-2 px-0 text-stone-800 placeholder-stone-400 focus:outline-none focus:border-amber-700 transition-colors duration-200"/>
            </div>

            <!-- Membership Type -->
            <div>
                <label class="block text-xs tracking-widest text-stone-500 uppercase mb-3">Membership Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative flex items-center gap-3 border border-stone-200 rounded-xl p-4 cursor-pointer hover:border-amber-600 transition-colors has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50">
                        <input type="radio" name="membershipType" value="Regular" checked class="accent-amber-700"/>
                        <div>
                            <p class="text-sm font-medium text-stone-800">Regular</p>
                            <p class="text-xs text-stone-400 mt-0.5">Standard access</p>
                        </div>
                    </label>
                    <label class="relative flex items-center gap-3 border border-stone-200 rounded-xl p-4 cursor-pointer hover:border-amber-600 transition-colors has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50">
                        <input type="radio" name="membershipType" value="VIP" class="accent-amber-700"/>
                        <div>
                            <p class="text-sm font-medium text-stone-800">VIP</p>
                            <p class="text-xs text-stone-400 mt-0.5">Exclusive perks</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full bg-stone-800 hover:bg-amber-800 text-white text-sm tracking-widest uppercase py-3.5 rounded-xl transition-colors duration-200 mt-2">
                Create Account
            </button>

        </form>

        <p class="text-center text-sm text-stone-500 mt-6">
            Already have an account?
            <a th:href="@{/users/login}" class="text-amber-700 hover:underline font-medium">Sign in</a>
        </p>

    </div>
</div>

</body>
</html>
