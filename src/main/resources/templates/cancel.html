<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cancel Reservation – TableGlo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, .serif { font-family: 'Cormorant Garamond', serif; }
        .bg-texture {
            background-color: #faf8f5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-texture min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">

    <!-- Brand -->
    <div class="text-center mb-8">
        <h1 class="serif text-4xl font-semibold text-stone-800">TableGlo</h1>
    </div>

    <div class="bg-white/80 border border-stone-200 rounded-2xl shadow-sm p-8">

        <!-- Warning icon -->
        <div class="flex justify-center mb-5">
            <div class="w-14 h-14 rounded-full bg-red-50 border border-red-200 flex items-center justify-center">
                <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                </svg>
            </div>
        </div>

        <h2 class="serif text-3xl font-semibold text-stone-800 text-center mb-1">Cancel Reservation?</h2>
        <p class="text-stone-500 text-sm text-center mb-6">Please review the details before confirming.</p>

        <!-- Reservation details -->
        <div class="bg-stone-50 border border-stone-200 rounded-xl p-5 space-y-3 mb-6">
            <div class="flex justify-between text-sm">
                <span class="text-stone-400 uppercase tracking-wider text-xs">Reservation ID</span>
                <span class="font-mono text-xs text-stone-600" th:text="${reservation.reservationId}">R001</span>
            </div>
            <div class="flex justify-between text-sm border-t border-stone-200 pt-3">
                <span class="text-stone-400 uppercase tracking-wider text-xs">Table</span>
                <span class="text-stone-700 font-medium" th:text="${reservation.tableId}">T01</span>
            </div>
            <div class="flex justify-between text-sm border-t border-stone-200 pt-3">
                <span class="text-stone-400 uppercase tracking-wider text-xs">Date</span>
                <span class="text-stone-700" th:text="${reservation.reservationDate}">2024-01-01</span>
            </div>
            <div class="flex justify-between text-sm border-t border-stone-200 pt-3">
                <span class="text-stone-400 uppercase tracking-wider text-xs">Time Slot</span>
                <span class="text-stone-700" th:text="${reservation.timeSlot}">07:30 PM</span>
            </div>
        </div>

        <!-- Fee warning -->
        <!-- VIP: free cancellation -->
        <div th:if="${user.membershipType == 'VIP'}"
             class="mb-6 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-center gap-3">
            <span class="text-amber-600">★</span>
            <p class="text-sm text-amber-800">As a <strong>VIP member</strong>, this cancellation is <strong>free of charge</strong>.</p>
        </div>

        <!-- Regular: fee applies -->
        <div th:if="${user.membershipType != 'VIP'}"
             class="mb-6 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
            <p class="text-sm text-red-700">
                A cancellation fee of <strong>LKR 500.00</strong> will be applied to your account.
            </p>
        </div>

        <!-- Action buttons -->
        <div class="flex gap-3">
            <a th:href="@{/reservations/my}"
               class="flex-1 text-center text-sm text-stone-600 hover:text-stone-800 border border-stone-200 hover:border-stone-400 py-3 rounded-xl transition-colors">
                Go Back
            </a>
            <form th:action="@{/reservations/cancel/{id}(id=${reservation.reservationId})}"
                  method="post" class="flex-1">
                <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 text-white text-sm tracking-widest uppercase py-3 rounded-xl transition-colors">
                    Confirm Cancel
                </button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
